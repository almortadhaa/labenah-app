<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة مساحة اللبنة اليمنية والتفقيط التقليدي</title>
    <!-- استيراد ملف ربط الواجهة التطبيقية PWA -->
    <link rel="manifest" href="manifest.json">
    <!-- استيراد Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white shadow-lg rounded-2xl p-6 w-full max-w-lg border border-gray-200">
        <header class="mb-6 text-center">
            <h1 class="text-2xl font-bold text-gray-800">حاسبة مساحة اللبنة اليمنية</h1>
            <p class="text-sm text-gray-500 mt-1">النسخة المطابقة لنظام التفقيط التقليدي (المرتضى 712774466)</p>
        </header>

        <!-- حقل إدخال المساحة الإجمالية -->
        <div class="mb-4">
            <label for="areaInput" class="block text-sm font-semibold text-gray-700 mb-2">أدخل المساحة الإجمالية بالمتر المربع:</label>
            <input type="number" id="areaInput" step="any" placeholder="مثال: 100" 
                class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-lg">
        </div>

        <!-- قائمة اختيار نوع اللبنة -->
        <div class="mb-6">
            <label for="typeCell" class="block text-sm font-semibold text-gray-700 mb-2">اختر نوع اللبنة:</label>
            <select id="typeCell" 
                class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white text-lg">
                <option value="لبنة صنعاني">لبنة صنعاني (عشاري)</option>
                <option value="لبنة هدوي">لبنة هدوي</option>
                <option value="لبنة ذماري">لبنة ذماري</option>
                <option value="لبنة عمراني">لبنة عمراني</option>
            </select>
        </div>

        <!-- زر الحساب -->
        <button onclick="calculateArea()" 
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition duration-200 shadow-md text-lg">
            اضغط هنا لعرض الناتج للمساحة المدخلة اعلاه
        </button>

        <!-- قسم النتائج -->
        <div id="resultContainer" class="mt-6 space-y-4 hidden">
            <div class="p-4 bg-blue-50 rounded-xl border border-blue-100">
                <h2 class="text-xs font-semibold text-blue-800 mb-1">النتيجة باللبنة والذراع:</h2>
                <p id="resultCombined" class="text-lg font-bold text-blue-900 leading-relaxed"></p>
            </div>
        </div>
    </div>

    <script>
        function convertHundreds(n, isFeminine) {
            if (n === 0) return "";
            let res = "";
            let h = Math.floor(n / 100);
            let rem = n % 100;

            if (h > 0) {
                switch (h) {
                    case 1: res = "مئة"; break;
                    case 2: res = "مئتان"; break;
                    case 3: res = "ثلاث مئة"; break;
                    case 4: res = "أربع مئة"; break;
                    case 5: res = "خمس مئة"; break;
                    case 6: res = "ست مئة"; break;
                    case 7: res = "سبع مئة"; break;
                    case 8: res = "ثمان مئة"; break;
                    case 9: res = "تسع مئة"; break;
                }
                if (rem > 0) res += " و ";
            }

            if (rem > 0) {
                if (rem < 10) {
                    switch (rem) {
                        case 1: res += isFeminine ? "واحدة" : "واحد"; break;
                        case 2: res += isFeminine ? "اثنتان" : "اثنان"; break;
                        case 3: res += isFeminine ? "ثلاث" : "ثلاثة"; break;
                        case 4: res += isFeminine ? "أربع" : "أربعة"; break;
                        case 5: res += isFeminine ? "خمس" : "خمسة"; break;
                        case 6: res += isFeminine ? "ست" : "ستة"; break;
                        case 7: res += isFeminine ? "سبع" : "سبعة"; break;
                        case 8: res += isFeminine ? "ثمان" : "ثمانية"; break;
                        case 9: res += isFeminine ? "تسع" : "تسعة"; break;
                    }
                } else if (rem === 10) {
                    res += isFeminine ? "عشر" : "عشرة";
                } else if (rem === 11) {
                    res += isFeminine ? "إحدى عشرة" : "أحد عشر";
                } else if (rem === 12) {
                    res += isFeminine ? "اثنتا عشرة" : "اثنا عشر";
                } else if (rem >= 13 && rem <= 19) {
                    let d = rem % 10;
                    let bText = "";
                    switch (d) {
                        case 3: bText = isFeminine ? "ثلاث" : "ثلاثة"; break;
                        case 4: bText = isFeminine ? "أربع" : "أربعة"; break;
                        case 5: bText = isFeminine ? "خمس" : "خمسة"; break;
                        case 6: bText = isFeminine ? "ست" : "ستة"; break;
                        case 7: bText = isFeminine ? "سبع" : "سبعة"; break;
                        case 8: bText = isFeminine ? "ثمان" : "ثمانية"; break;
                        case 9: bText = isFeminine ? "تسع" : "تسعة"; break;
                    }
                    res += bText + " عشر" + (isFeminine ? "ة" : "");
                } else {
                    let tens = Math.floor(rem / 10) * 10;
                    let units = rem % 10;
                    let tText = "";
                    switch (tens) {
                        case 20: tText = "عشرون"; break;
                        case 30: tText = "ثلاثون"; break;
                        case 40: tText = "أربعون"; break;
                        case 50: tText = "خمسون"; break;
                        case 60: tText = "ستون"; break;
                        case 70: tText = "سبعون"; break;
                        case 80: tText = "ثمانون"; break;
                        case 90: tText = "تسعون"; break;
                    }
                    if (units === 0) {
                        res += tText;
                    } else {
                        let uText = "";
                        switch (units) {
                            case 1: uText = isFeminine ? "واحدة" : "واحد"; break;
                            case 2: uText = isFeminine ? "اثنتان" : "اثنان"; break;
                            case 3: uText = isFeminine ? "ثلاث" : "ثلاثة"; break;
                            case 4: uText = isFeminine ? "أربع" : "أربعة"; break;
                            case 5: uText = isFeminine ? "خمس" : "خمسة"; break;
                            case 6: uText = isFeminine ? "ست" : "ستة"; break;
                            case 7: uText = isFeminine ? "سبع" : "سبعة"; break;
                            case 8: uText = isFeminine ? "ثمان" : "ثمانية"; break;
                            case 9: uText = isFeminine ? "تسع" : "تسعة"; break;
                        }
                        res += uText + " و " + tText;
                    }
                }
            }
            return res;
        }

        function numberToArabicText(n, isFeminine) {
            if (n === 0) return "صفر";
            let parts = [];
            let millions = Math.floor(n / 1000000);
            let thousands = Math.floor((n % 1000000) / 1000);
            let remVal = n % 1000;

            if (millions > 0) {
                let mText = "";
                if (millions === 1) mText = "مليون";
                else if (millions === 2) mText = "مليونان";
                else if (millions >= 3 && millions <= 10) mText = convertHundreds(millions, false) + " ملايين";
                else mText = convertHundreds(millions, false) + " مليوناً";
                parts.push(mText);
            }

            if (thousands > 0) {
                let tText = "";
                if (thousands === 1) tText = "ألف";
                else if (thousands === 2) tText = "ألفان";
                else if (thousands >= 3 && thousands <= 10) tText = convertHundreds(thousands, false) + " آلاف";
                else tText = convertHundreds(thousands, false) + " ألفاً";
                parts.push(tText);
            }

            if (remVal > 0) {
                parts.push(convertHundreds(remVal, isFeminine));
            }

            return parts.join(" و ");
        }

        function formatArabicResult(val, idx, unitSingular, unitPlural, isFeminine) {
            let numText = numberToArabicText(val, isFeminine);
            let fracText = "";

            const fractions = {
                0: "", 1: "نصف ربع الثمن", 2: "ربع الثمن", 3: "ربع الثمن ونصف ربع الثمن",
                4: "نصف ثمن", 5: "نصف ثمن ونصف ربع الثمن", 6: "نصف ثمن وربع الثمن", 7: "نصف ثمن وربع الثمن ونصف ربع الثمن",
                8: "ثمن", 9: "ثمن ونصف ربع الثمن", 10: "ثمن وربع الثمن", 11: "ثمن وربع الثمن ونصف ربع الثمن",
                12: "ثمن ونصف ثمن", 13: "ثمن ونصف ثمن ونصف ربع الثمن", 14: "ثمن ونصف ثمن وربع الثمن", 15: "ثمن ونصف ثمن وربع الثمن ونصف ربع الثمن",
                16: "ربع", 17: "ربع ونصف ربع الثمن", 18: "ربع وربع الثمن", 19: "ربع وربع الثمن ونصف ربع الثمن",
                20: "ربع ونصف ثمن", 21: "ربع ونصف ثمن ونصف ربع الثمن", 22: "ربع ونصف ثمن وربع الثمن", 23: "ربع ونصف ثمن وربع الثمن ونصف ربع الثمن",
                24: "ربع وثمن", 25: "ربع وثمن ونصف ربع الثمن", 26: "ربع وثمن وربع الثمن", 27: "ربع وثمن وربع الثمن ونصف ربع الثمن",
                28: "ربع وثمن ونصف ثمن", 29: "ربع وثمن ونصف ثمن ونصف ربع الثمن", 30: "ربع وثمن ونصف ثمن وربع الثمن", 31: "ربع وثمن ونصف ثمن وربع الثمن ونصف ربع الثمن",
                32: "نصف", 33: "نصف ونصف ربع الثمن", 34: "نصف وربع الثمن", 35: "نصف وربع الثمن ونصف ربع الثمن",
                36: "نصف ونصف ثمن", 37: "نصف ونصف ثمن ونصف ربع الثمن", 38: "نصف ونصف ثمن وربع الثمن", 39: "نصف ونصف ثمن وربع الثمن ونصف ربع الثمن",
                40: "نصف وثمن", 41: "نصف وثمن ونصف ربع الثمن", 42: "نصف وثمن وربع الثمن", 43: "نصف وثمن وربع الثمن ونصف ربع الثمن",
                44: "نصف وثمن ونصف ثمن", 45: "نصف وثمن ونصف ثمن ونصف ربع الثمن", 46: "نصف وثمن ونصف ثمن وربع الثمن", 47: "نصف وثمن ونصف ثمن وربع الثمن ونصف ربع الثمن",
                48: "نصف وربع", 49: "نصف وربع ونصف ربع الثمن", 50: "نصف وربع وربع الثمن", 51: "نصف وربع وربع الثمن ونصف ربع الثمن",
                52: "نصف وربع ونصف ثمن", 53: "نصف وربع ونصف ثمن ونصف ربع الثمن", 54: "نصف وربع ونصف ثمن وربع الثمن", 55: "نصف وربع ونصف ثمن وربع الثمن ونصف ربع الثمن",
                56: "نصف وربع وثمن", 57: "نصف وربع وثمن ونصف ربع الثمن", 58: "نصف وربع وثمن وربع الثمن", 59: "نصف وربع وثمن وربع الثمن ونصف ربع الثمن",
                60: "نصف وربع وثمن ونصف ثمن", 61: "نصف وربع وثمن ونصف ثمن ونصف ربع الثمن", 62: "نصف وربع وثمن ونصف ثمن وربع الثمن", 63: "نصف وربع وثمن ونصف ثمن وربع الثمن ونصف ربع الثمن"
            };

            fracText = fractions[idx] || "";

            let currentUnitName = unitSingular;
            if (val === 2) currentUnitName = unitSingular;
            else if (val >= 3 && val <= 10) currentUnitName = unitPlural;

            let result = "";
            if (val > 0) {
                if (fracText !== "") {
                    result = numText + " " + currentUnitName + " و (" + fracText + ") " + unitSingular;
                } else {
                    result = numText + " " + currentUnitName;
                }
            } else {
                if (fracText !== "") {
                    result = "(" + fracText + ") " + unitSingular;
                } else {
                    result = "صفر " + unitSingular;
                }
            }
            return result;
        }

        function calculateArea() {
            let inputVal = parseFloat(document.getElementById('areaInput').value);
            let typeVal = document.getElementById('typeCell').value.trim();

            let resultContainer = document.getElementById('resultContainer');
            let resultCombined = document.getElementById('resultCombined');

            if (isNaN(inputVal) || inputVal <= 0) {
                alert('الرجاء إدخال قيمة صحيحة للمساحة.');
                resultContainer.classList.add('hidden');
                return;
            }

            let sqmPerLibnah = 44.4444;
            let dhraPerLibnah = 10;

            if (typeVal.includes("هدوي")) {
                sqmPerLibnah = 29.16; dhraPerLibnah = 12;
            } else if (typeVal.includes("ذماري")) {
                sqmPerLibnah = 114.49; dhraPerLibnah = 16;
            } else if (typeVal.includes("عمراني")) {
                sqmPerLibnah = 64; dhraPerLibnah = 12;
            }

            let totalLibnah = inputVal / sqmPerLibnah;
            let fullLibnah = Math.floor(totalLibnah);
            let index = Math.round((totalLibnah - fullLibnah) / 0.015625);
            if (index >= 64) {
                fullLibnah += 1;
                index = 0;
            }

            let b3Text = formatArabicResult(fullLibnah, index, "لبنة", "لبن", true);

            let diff = inputVal - ((fullLibnah + (index * 0.015625)) * sqmPerLibnah);
            let b4Text = "";
            if (Math.abs(diff) > 0.0001) {
                let remDhra = (inputVal - (fullLibnah * sqmPerLibnah)) / (sqmPerLibnah / dhraPerLibnah);
                let fullDhra = Math.floor(remDhra);
                let dhraIndex = Math.round((remDhra - fullDhra) / 0.015625);
                if (dhraIndex >= 64) {
                    fullDhra += 1;
                    dhraIndex = 0;
                }
                b4Text = formatArabicResult(fullDhra, dhraIndex, "ذراع", "أذرع", false);
            }

            if (b4Text !== "") {
                resultCombined.innerText = b3Text + " و " + b4Text;
            } else {
                resultCombined.innerText = b3Text;
            }

            resultContainer.classList.remove('hidden');
        }
    </script>
</body>
</html>
